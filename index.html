<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>一括切り抜きツール</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb}
*{box-sizing:border-box}body{margin:0;padding:22px;max-width:1100px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}
h1{font-size:clamp(22px,4vw,32px);margin:0}p{color:#637083;margin:.5rem 0}
main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,1fr);gap:16px}
.panel{background:white;border:1px solid #e2e7ef;border-radius:18px;padding:16px;box-shadow:0 4px 16px #20304a08}
.preview{position:relative;background:#182333;border-radius:12px;overflow:hidden;min-height:280px;display:flex;align-items:center;justify-content:center}
#mainImg{max-width:100%;max-height:65vh;display:block;user-select:none;touch-action:none}
#crop{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px #0b172a70;cursor:move;touch-action:none}
#crop:after{content:"";position:absolute;inset:0;background:linear-gradient(to right,transparent 33%,#ffffff80 33%,#ffffff80 34%,transparent 34%,transparent 66%,#ffffff80 66%,#ffffff80 67%,transparent 67%),linear-gradient(to bottom,transparent 33%,#ffffff80 33%,#ffffff80 34%,transparent 34%,transparent 66%,#ffffff80 66%,#ffffff80 67%,transparent 67%);pointer-events:none}
.handle{position:absolute;width:14px;height:14px;background:white;border:1px solid #1673ee;border-radius:50%;right:-7px;bottom:-7px;cursor:nwse-resize}
.controls{display:grid;gap:14px}label{font-weight:600;display:block;margin-bottom:7px}select,input{font:inherit;padding:10px;border:1px solid #d8dfeb;border-radius:10px;background:#fff;width:100%}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;border:0;border-radius:12px;padding:13px 16px;cursor:pointer;font-weight:650}
.primary{background:#1673ee;color:white}.secondary{background:#eef3fb;color:#26344a}
#thumbs{display:flex;gap:10px;overflow:auto;padding:10px 0}
.thumb{width:86px;height:86px;object-fit:cover;border-radius:10px;border:3px solid transparent;flex:none;cursor:pointer}
.thumb.active{border-color:#1673ee}
.note{font-size:13px;background:#edf5ff;color:#23456e;padding:12px;border-radius:12px;line-height:1.6}
@media(max-width:760px){body{padding:12px}main{grid-template-columns:1fr}.preview{min-height:250px}#mainImg{max-height:55vh}}
</style>
</head>
<body>
<header><div><h1>▣ 一括切り抜きツール</h1><p>1枚目で範囲を決め、同じ比率・位置でほかの写真も切り抜きます。</p></div></header>
<div class="panel" style="margin-bottom:16px"><label for="files">写真を選択（複数可）</label><input id="files" type="file" accept="image/*" multiple></div>
<main>
<section class="panel">
<h3 style="margin-top:0">切り取り範囲を調整</h3>
<div class="preview" id="preview"><img id="mainImg" alt="選択した写真"><div id="crop" hidden><span class="handle"></span></div></div>
<div id="thumbs"></div>
</section>
<section class="panel controls">
<div><label>縦横比</label><select id="ratio"><option value="1">1:1（正方形）</option><option value="0.75">3:4（縦）</option><option value="1.333">4:3</option><option value="1.5">3:2</option><option value="1.777">16:9</option><option value="free">自由</option></select></div>
<div class="note" id="dimensionInfo">元画像・切り抜き範囲のピクセル数を表示します。</div>
<div class="row"><div><label>出力幅(px)</label><input id="outW" type="number" min="1" value="500"></div><div><label>出力高さ(px)</label><input id="outH" type="number" min="1" value="500"></div></div>
<div class="row"><button class="secondary" id="autoSize">切り抜き実寸を出力サイズにする</button><button class="secondary" id="resetSize">500×500に戻す</button></div>
<div class="note">枠をドラッグして移動、右下の丸をドラッグしてサイズ変更。枠の位置・サイズは画像に対する割合として、すべての写真に適用されます。</div>
<button class="primary" id="process">すべての写真を切り抜く</button>
<button class="primary" id="saveAll" disabled>一括保存（共有）</button>
<button class="secondary" id="previewOne">選択中の写真を切り抜いて確認</button>
<div id="status" aria-live="polite" style="font-size:13px;color:#536174"></div>
<div id="results" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px"></div>
</section>
</main>
<script>
const filesEl=document.querySelector('#files'),img=document.querySelector('#mainImg'),crop=document.querySelector('#crop'),preview=document.querySelector('#preview'),thumbs=document.querySelector('#thumbs'),ratioEl=document.querySelector('#ratio'),status=document.querySelector('#status');
let items=[],active=0,box={x:.2,y:.2,w:.6,h:.6},drag=null,display={x:0,y:0,w:0,h:0},cropInitialized=false;
function loadItem(i){active=i;img.onload=()=>{fit();if(!cropInitialized){setRatio();cropInitialized=true}else{drawCrop()}};img.src=items[i].url;[...thumbs.children].forEach((t,j)=>t.classList.toggle('active',j===i))}
function fit(){const p=preview.getBoundingClientRect(),nw=img.naturalWidth,nh=img.naturalHeight;let s=Math.min((p.width-12)/nw,(p.height-12)/nh);display.w=nw*s;display.h=nh*s;display.x=(p.width-display.w)/2;display.y=(p.height-display.h)/2;img.style.width=display.w+'px';img.style.height=display.h+'px';img.style.position='absolute';img.style.left=display.x+'px';img.style.top=display.y+'px'}
function drawCrop(){if(!img.naturalWidth)return;crop.hidden=false;crop.style.left=(display.x+box.x*display.w)+'px';crop.style.top=(display.y+box.y*display.h)+'px';crop.style.width=(box.w*display.w)+'px';crop.style.height=(box.h*display.h)+'px';updateDimensions()}
function updateDimensions(){if(!img.naturalWidth)return;const sw=Math.round(box.w*img.naturalWidth),sh=Math.round(box.h*img.naturalHeight);document.querySelector('#dimensionInfo').textContent=`元画像：${img.naturalWidth} × ${img.naturalHeight} px ／ 切り抜き範囲：約${sw} × ${sh} px`;}
document.querySelector('#autoSize').onclick=()=>{document.querySelector('#outW').value=Math.max(1,Math.round(box.w*img.naturalWidth));document.querySelector('#outH').value=Math.max(1,Math.round(box.h*img.naturalHeight));};
document.querySelector('#resetSize').onclick=()=>{document.querySelector('#outW').value=500;document.querySelector('#outH').value=500;};
function setRatio(){let r=ratioEl.value;if(r==='free')return;const ar=Number(r),imageAR=img.naturalWidth/img.naturalHeight;let w=.65,h=w*imageAR/ar;if(h>.75){h=.75;w=h*ar/imageAR}box.w=w;box.h=h;box.x=(1-w)/2;box.y=(1-h)/2;drawCrop()}
filesEl.onchange=()=>{items.forEach(x=>URL.revokeObjectURL(x.url));cropInitialized=false;items=[...filesEl.files].filter(f=>f.type.startsWith('image/')).map(f=>({file:f,url:URL.createObjectURL(f)}));thumbs.innerHTML='';items.forEach((it,i)=>{let t=document.createElement('img');t.src=it.url;t.className='thumb';t.onclick=()=>loadItem(i);thumbs.append(t)});if(items.length)loadItem(0);status.textContent=items.length+'枚の写真を読み込みました。1枚目の切り取り枠を調整してください。'};
ratioEl.onchange=setRatio;
function pointer(e){const r=preview.getBoundingClientRect();return{x:(e.clientX-r.left-display.x)/display.w,y:(e.clientY-r.top-display.y)/display.h}}
crop.addEventListener('pointerdown',e=>{e.preventDefault();crop.setPointerCapture(e.pointerId);let p=pointer(e),isHandle=e.target.classList.contains('handle');drag={isHandle,start:p,box:{...box}}});
crop.addEventListener('pointermove',e=>{if(!drag)return;let p=pointer(e),dx=p.x-drag.start.x,dy=p.y-drag.start.y;if(drag.isHandle){box.w=Math.max(.08,Math.min(1-drag.box.x,drag.box.w+dx));box.h=Math.max(.08,Math.min(1-drag.box.y,drag.box.h+dy));if(ratioEl.value!=='free'){let ar=Number(ratioEl.value),imageAR=img.naturalWidth/img.naturalHeight;box.h=box.w*imageAR/ar}}else{box.x=Math.max(0,Math.min(1-box.w,drag.box.x+dx));box.y=Math.max(0,Math.min(1-box.h,drag.box.y+dy))}drawCrop()});
crop.addEventListener('pointerup',()=>drag=null);crop.addEventListener('pointercancel',()=>drag=null);
function makeCanvas(item){return new Promise((resolve,reject)=>{let im=new Image();im.onload=()=>{let sx=box.x*im.naturalWidth,sy=box.y*im.naturalHeight,sw=box.w*im.naturalWidth,sh=box.h*im.naturalHeight;let c=document.createElement('canvas');c.width=Math.max(1,+document.querySelector('#outW').value);c.height=Math.max(1,+document.querySelector('#outH').value);c.getContext('2d').drawImage(im,sx,sy,sw,sh,0,0,c.width,c.height);c.toBlob(b=>resolve(b),'image/jpeg',.92)};im.onerror=reject;im.src=item.url})}
let previewBlob=null,processedBlobs=[];
document.querySelector('#previewOne').onclick=async()=>{
 if(!items.length){status.textContent='先に写真を選んでください';return}
 previewBlob=await makeCanvas(items[active]);
 let u=URL.createObjectURL(previewBlob);
 let old=document.querySelector('#previewModal');if(old)old.remove();
 let modal=document.createElement('div');modal.id='previewModal';
 modal.style.cssText='position:fixed;inset:0;background:#000b;z-index:99;display:flex;align-items:center;justify-content:center;padding:20px';
 modal.innerHTML='<div style="background:white;border-radius:16px;padding:16px;max-width:95vw;max-height:90vh;overflow:auto;text-align:center"><h3>切り抜きプレビュー</h3><img src="'+u+'" style="max-width:80vw;max-height:60vh;display:block;margin:auto"><p><button id="savePreview" class="primary">写真に保存 / 共有</button> <button id="closePreview" class="secondary">閉じる</button></p><small>「写真に保存」が共有メニューに表示されます。</small></div>';
 document.body.append(modal);
 modal.querySelector('#closePreview').onclick=()=>modal.remove();
 modal.querySelector('#savePreview').onclick=()=>shareBlob(previewBlob, 'cropped_'+items[active].file.name.replace(/\.[^.]+$/,'')+'.jpg');
};
async function shareBlob(blob,name){
 const file=new File([blob],name,{type:'image/jpeg'});
 if(navigator.canShare && navigator.canShare({files:[file]}) && navigator.share){
  try{await navigator.share({files:[file],title:name})}catch(e){if(e.name!=='AbortError')status.textContent='共有に失敗しました: '+e.message}
 }else{
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();
  status.textContent='画像をダウンロードしました。写真アプリへは画像を開いて共有メニューから保存してください。'
 }
}
document.querySelector('#process').onclick=async()=>{
 if(!items.length){status.textContent='先に写真を選んでください';return}
 let results=document.querySelector('#results');results.innerHTML='';
 status.textContent='切り抜き画像を作成中…';
 for(let i=0;i<items.length;i++){
  let b=await makeCanvas(items[i]),url=URL.createObjectURL(b),name='crop_'+(i+1).toString().padStart(2,'0')+'.jpg';processedBlobs.push({blob:b,name});
  let card=document.createElement('div');card.style.cssText='border:1px solid #e2e7ef;border-radius:12px;padding:8px;text-align:center';
  card.innerHTML='<img src="'+url+'" style="width:100%;aspect-ratio:1;object-fit:contain;border-radius:8px"><button class="secondary" style="width:100%;padding:8px;margin-top:6px">写真に保存</button>';
  card.querySelector('button').onclick=()=>shareBlob(b,name);results.append(card);
  status.textContent=(i+1)+'/'+items.length+'枚を作成しました';
 }
 status.textContent='完了！個別保存または一括保存ができます。';document.querySelector('#saveAll').disabled=false;
};
document.querySelector('#saveAll').onclick=async()=>{if(!processedBlobs.length)return;const files=processedBlobs.map(x=>new File([x.blob],x.name,{type:'image/jpeg'}));if(navigator.canShare&&navigator.canShare({files})&&navigator.share){try{await navigator.share({files,title:'切り抜き画像'})}catch(e){if(e.name!=='AbortError')status.textContent='一括共有に失敗しました。個別保存を使ってください。'}}else{for(const x of processedBlobs){const a=document.createElement('a');a.href=URL.createObjectURL(x.blob);a.download=x.name;a.click()}status.textContent='画像を順番にダウンロードしました。写真アプリへは各画像を共有メニューから保存してください。'}};
window.addEventListener('resize',()=>{fit();drawCrop()});
</script>
</body></html>
